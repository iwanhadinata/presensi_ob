<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Presensi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #setupPanel { margin-bottom: 20px; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
    #result { margin-top: 20px; font-weight: bold; color: green; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>Scanner Presensi</h2>

  <!-- Panel Input Nama -->
  <div id="setupPanel">
    <input type="text" id="namaPekerja" placeholder="Masukkan Nama Anda" required>
    <br>
    <button onclick="mulaiScan()">Mulai Scan</button>
  </div>

  <div id="reader"></div>
  <div id="result"></div>

  <script>
    // GANTI URL di bawah ini kalau nanti Anda deploy ulang Apps Script
    // dan mendapat URL /exec yang baru.
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDkPtmZp5bfd6DIefBCKmWMAwhbXLSZr3KbeLzhSrtWOOJ4Z_e72fTOTQZwvMF5ePjEQ/exec";

    let html5QrcodeScanner;
    let namaUser = "";

    function mulaiScan() {
      namaUser = document.getElementById('namaPekerja').value;
      if (!namaUser) {
        alert("Silakan masukkan nama terlebih dahulu!");
        return;
      }

      document.getElementById('setupPanel').style.display = "none";
      document.getElementById('reader').style.display = "block";
      document.getElementById('result').innerText = "Arahkan kamera ke QR Code...";
      document.getElementById('result').style.color = "green";

      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
      html5QrcodeScanner.render(onScanSuccess);
    }

    function onScanSuccess(decodedText, decodedResult) {
      html5QrcodeScanner.clear();
      document.getElementById('result').innerText = "Memproses data " + namaUser + "...";

      // Nama diisi dari input, Lokasi diambil dari hasil scan QR
      const dataKirim = {
        nama: namaUser,
        lokasi: decodedText
      };

      // mode: 'no-cors' dipakai karena Apps Script tidak mengirim header CORS
      // lengkap untuk POST. Request tetap diproses & disimpan di server,
      // hanya saja kita tidak bisa membaca balasan JSON-nya (opaque response),
      // jadi pesan sukses ditampilkan langsung dari sisi HTML.
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(dataKirim)
      })
        .then(() => {
          document.getElementById('result').innerText = "Presensi berhasil dicatat untuk: " + namaUser;
          document.getElementById('result').style.color = "green";
          setTimeout(() => location.reload(), 3000);
        })
        .catch(err => {
          document.getElementById('result').innerText = "Gagal terhubung ke server: " + err.message;
          document.getElementById('result').style.color = "red";
        });
    }
  </script>
</body>
</html>
